<section class="servicios-page">
  <div class="servicios-hero hero-servicios">
    <div>
      <p class="eyebrow">Umbrella Corporation</p>
      <h2>Editar servicio</h2>
      <p class="subtitle">Actualiza la información del servicio seleccionado.</p>
    </div>
    <button class="btn btn-volver" (click)="cancelar()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Volver al listado
    </button>
  </div>

  @if (error()) {
    <div class="feedback error">
      {{ error() }}
    </div>
  }

  @if (loading()) {
    <div class="panel estado">
      Cargando información del servicio...
    </div>
  }

  @if (!loading() && servicio()) {
    <app-servicio-form
      [servicio]="servicio()"
      [saving]="saving()"
      [profesionales]="profesionales()"
      [categorias]="categorias()"
      [especialidades]="especialidades()"
      (guardar)="guardar($event)"
      (cancelar)="cancelar()"
    />
  }
</section>
