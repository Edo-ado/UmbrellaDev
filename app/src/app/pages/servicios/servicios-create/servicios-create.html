<section class="profesionales-page">
  <div class="profesionales-hero">

    
    <div>


      
      <p class="eyebrow">Umbrella Corporation</p>
      <h2>Crear servicio</h2>
      <p class="subtitle">Registra un nuevo servicio en el sistema.</p>
    </div>
  </div>

  @if (error) {
    <div class="feedback error">
      {{ error }}
    </div>
  }

<app-servicio-form
  [saving]="saving"
  [profesionales]="profesionales"
  [categorias]="categorias"
  [especialidades]="especialidades"
  (guardar)="guardar($event)"
  (cancelar)="cancelar()"
/>
</section>
