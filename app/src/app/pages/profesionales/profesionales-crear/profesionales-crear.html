<section class="profesionales-page">
  <div class="profesionales-hero">
    <div>
      <p class="eyebrow">Umbrella Corporation</p>
      <h2>Nuevo profesional</h2>
      <p class="subtitle">Registra un nuevo profesional en el sistema.</p>
    </div>
  </div>

  <div class="feedback error" >
    {{ error() }}
  </div>



  <app-profesional-form
   
    [saving]="saving()"
    [especialidades]="especialidades()"
    (guardar)="guardar($event)"
    (cancelar)="cancelar()"
  ></app-profesional-form>
</section>
