<section class="profesionales-page">
  <div class="profesionales-hero">
    <div>
      <p class="eyebrow">Umbrella Corporation</p>
      <h2>Editar profesional</h2>
      <p class="subtitle">Actualiza la información del profesional.</p>
    </div>
    <button class="btn btn-secundario" (click)="cancelar()">← Volver al listado</button>
  </div>

  @if (error()) {
    <div class="feedback error">
      {{ error() }}
    </div>
  }

  @if (loading()) {
    <div class="panel estado">
      Cargando información del profesional...
    </div>
  }

  @if (!loading() && profesional()) {
    <app-profesional-form
      [profesional]="profesional()"
      [saving]="saving()"
      [especialidades]="especialidades()"
      (guardar)="guardar($event)"
      (cancelar)="cancelar()"
    ></app-profesional-form>
  }
</section>
